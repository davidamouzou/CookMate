name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-unit:
    name: Backend - Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install test runner
        run: pip install pytest
      - name: Run unit tests
        run: |
          if [ -d tests ]; then
            pytest -q -m "not integration" || [ $? -eq 5 ]
          else
            echo "No backend tests directory; skipping unit tests."
          fi

  backend-integration:
    name: Backend - Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install test runner
        run: pip install pytest
      - name: Run integration tests
        run: |
          if [ -d tests ]; then
            pytest -q -m integration || [ $? -eq 5 ]
          else
            echo "No backend tests directory; skipping integration tests."
          fi

  backend-security:
    name: Backend - Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install security tools
        run: pip install pip-audit bandit
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
      - name: Static analysis
        run: bandit -c bandit.yaml -r . -q
